name: Precompute domain availability

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/precompute.mjs
      - run: |
          git config user.name "precompute-bot"
          git config user.email "actions@github.com"
          git add public/data/precomputed.json
          git diff --staged --quiet || git commit -m "Update precomputed domain data"
          git push
